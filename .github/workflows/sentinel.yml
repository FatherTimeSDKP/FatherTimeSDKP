name: Ecosystem Sentinel Audit

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs automatically every 6 hours
  workflow_dispatch:        # Allows manual triggering from the Actions tab

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Grants permission to commit ledger updates back to the repo
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Ecosystem Sentinel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ecosystem_sentinel.py

      - name: Commit and Push Ledger Updates
        run: |
          git config --global user.name "FatherTimeSDKP-Sentinel"
          git config --global user.email "sentinel@users.noreply.github.com"
          git add sentinel_audit_ledger.json
          git diff --staged --quiet || git commit -m "chore: Update sentinel audit ledger prime seals [skip ci]"
          git push
