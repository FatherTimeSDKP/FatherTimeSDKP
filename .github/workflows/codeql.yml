name: "CodeQL Advanced"

on:
  push:
    branches: [ "Master-SDKP-Framework" ]
  pull_request:
    branches: [ "Master-SDKP-Framework" ]
  schedule:
    - cron: '36 14 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: autobuild
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:' \
        echo '  make bootstrap' \
        echo '  make release' \
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

auto-suppress: |
  # Temporary: only run this workflow on the default branch or when manually dispatched to avoid noisy failures on feature branches.
  # Removed from the 'on' triggers to keep the default behavior. This guard will be removed/reviewed before merging.
